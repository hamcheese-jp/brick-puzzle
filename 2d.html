<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>ブリックパズル</title>
<style>
:root{--bg:#fbf5e6;--panel:#ffffff;--ink:#222;--sub:#6b6458;--line:#e4dac3;--red:#d01012;--blue:#0055bf;--yellow:#f2cd37;--green:#237841}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1c1e23;--panel:#2a2d34;--ink:#eee;--sub:#a9a9a9;--line:#3a3e47}}
:root[data-theme="dark"]{--bg:#1c1e23;--panel:#2a2d34;--ink:#eee;--sub:#a9a9a9;--line:#3a3e47}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif}
body{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.screen{display:none;max-width:780px;margin:0 auto;padding:12px 16px 48px}
.screen.active{display:block}
button,select,input{font:inherit}
button{border:none;border-radius:10px;padding:9px 14px;background:var(--panel);color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.18);cursor:pointer;font-weight:700}
button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
button:disabled{opacity:.45;cursor:default}
button.red{background:var(--red);color:#fff}button.blue{background:var(--blue);color:#fff}
button.yellow{background:var(--yellow);color:#222}button.green{background:var(--green);color:#fff}
button.on{outline:3px solid var(--blue)}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.bar .grow{flex:1}
h1.logo{font-size:44px;line-height:1.1;text-align:center;margin:28px 0 6px;letter-spacing:2px;font-weight:900}
.logo span{display:inline-block;padding:4px 10px;margin:3px;border-radius:8px;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.tagline{text-align:center;color:var(--sub);margin-bottom:28px}
.menu{display:grid;gap:14px;max-width:360px;margin:0 auto}
.menu button{font-size:20px;padding:16px}
.small{font-size:13px;color:var(--sub)}
.center{text-align:center}
.group-title{margin:18px 0 8px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:8px}
.grid button{padding:10px 0;font-size:17px;position:relative}
.grid button .t{display:block;font-size:10px;font-weight:500;color:inherit;opacity:.8}
.grid button.clear{background:var(--green);color:#fff}
.panel{background:var(--panel);border-radius:14px;padding:10px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.topinfo{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.topinfo .meta{flex:1;min-width:0}
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--line);margin:2px 4px 2px 0}
#playCv,#freeCv{display:block;margin:0 auto;touch-action:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
.modal.show{display:flex}
.modal .box{background:var(--panel);border-radius:16px;padding:18px;max-width:440px;width:100%;max-height:92vh;overflow:auto;text-align:center}
.modal img{max-width:100%;max-height:46vh;border-radius:10px;margin:8px 0}
.modal .btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.palette{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.sw{width:30px;height:30px;border-radius:7px;padding:0;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.sw.on{outline:3px solid var(--ink);outline-offset:1px}
.shapes{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.shapes button{padding:4px;display:flex;align-items:center;justify-content:center;width:56px;height:48px}
.shapes canvas{pointer-events:none}
input[type=text]{padding:9px 10px;border-radius:10px;border:2px solid var(--line);background:var(--panel);color:var(--ink);min-width:0}
select{padding:8px;border-radius:10px;border:2px solid var(--line);background:var(--panel);color:var(--ink)}
.works{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.work{background:var(--panel);border-radius:12px;padding:8px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.work canvas{width:100%;height:auto;border-radius:8px}
.work .wt{font-weight:700;margin:4px 0 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.work .btns{display:flex;gap:4px;justify-content:center;margin-top:6px}
.work .btns button{padding:6px 8px;font-size:13px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:99px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20}
#toast.show{opacity:1}
.hint-text{font-size:13px;color:var(--sub);text-align:center;margin:6px 0}
</style>
</head>
<body>

<!-- タイトル -->
<section id="title" class="screen active">
  <h1 class="logo"><span style="background:#d01012">ブ</span><span style="background:#0055bf">リ</span><span style="background:#f2cd37;color:#222">ッ</span><span style="background:#237841">ク</span><br><span style="background:#fe8a18">パ</span><span style="background:#8a5cc4">ズ</span><span style="background:#1b2a34">ル</span></h1>
  <p class="tagline">お手本を見て、ピースを組み合わせて完成させよう！</p>
  <div class="menu">
    <button class="red" onclick="showSelect()">ステージ（100）</button>
    <button class="blue" onclick="openFree()">フリースペース</button>
    <button class="yellow" onclick="showGallery()">保存した作品</button>
  </div>
  <p class="center small" id="progressText" style="margin-top:22px"></p>
  <div class="bar" style="justify-content:center;margin-top:16px">
    <button onclick="exportData()">データを書き出す</button>
    <button onclick="document.getElementById('importFile').click()">データを読み込む</button>
    <input type="file" id="importFile" accept="application/json" style="display:none" onchange="importData(this)">
  </div>
  <p class="center small">進行状況と作品はこのブラウザに自動保存されます。</p>
</section>

<!-- ステージ選択 -->
<section id="select" class="screen">
  <div class="bar"><button onclick="show('title')">← もどる</button><b class="grow">ステージをえらぶ</b><span class="small" id="selCount"></span></div>
  <div id="stageGroups"></div>
</section>

<!-- プレイ -->
<section id="play" class="screen">
  <div class="bar">
    <button onclick="leavePlay()">←</button>
    <b class="grow" id="stageTitle">ステージ</b>
    <span id="timer" class="small">0:00</span>
    <button onclick="hint()" title="ヒント">💡 ヒント</button>
    <button onclick="resetStage()" title="リセット">↺</button>
  </div>
  <div class="panel topinfo">
    <canvas id="previewCv"></canvas>
    <div class="meta">
      <div class="small">つくるもの</div>
      <div style="font-weight:800;font-size:18px" id="stageName"></div>
      <div id="chips"></div>
    </div>
  </div>
  <canvas id="playCv"></canvas>
  <p class="hint-text">ドラッグで配置 ／ タップ・右クリック・Rキーで回転</p>
</section>

<!-- フリースペース -->
<section id="free" class="screen">
  <div class="bar">
    <button onclick="leaveFree()">←</button>
    <input type="text" id="freeTitle" class="grow" placeholder="作品のタイトル" maxlength="30">
    <button class="green" onclick="saveWork()">保存</button>
    <button class="blue" onclick="shareFree()">投稿</button>
  </div>
  <div class="panel" style="margin-bottom:10px">
    <div class="shapes" id="shapeBtns"></div>
    <div class="palette" id="colorBtns"></div>
    <div class="bar" style="margin:6px 0 0">
      <button onclick="freeRotate()">⟳ 回転</button>
      <button id="eraseBtn" onclick="toggleErase()">🧽 消しゴム</button>
      <button onclick="freeUndo()">↶ もどす</button>
      <button onclick="freeClear()">全消し</button>
      <select id="freeSize" onchange="freeResize(+this.value)">
        <option value="8">8×8</option><option value="12">12×12</option><option value="16" selected>16×16</option><option value="24">24×24</option><option value="32">32×32</option>
      </select>
      <select id="freePlate" onchange="F.plate=this.value;drawFree();autosave()">
        <option value="#237841">緑の板</option><option value="#a0a5a9">灰色の板</option><option value="#0055bf">青の板</option><option value="#f4f4f4">白の板</option><option value="#e4cd9e">ベージュの板</option><option value="#1b2a34">黒の板</option>
      </select>
    </div>
  </div>
  <canvas id="freeCv"></canvas>
  <p class="hint-text">タップ／なぞって置く ・ 消しゴムでタップして外す ・ Rキーで回転</p>
</section>

<!-- 作品一覧 -->
<section id="gallery" class="screen">
  <div class="bar"><button onclick="show('title')">← もどる</button><b class="grow">保存した作品</b><button class="blue" onclick="newFree()">＋ 新しく作る</button></div>
  <div class="works" id="worksList"></div>
  <p class="center small" id="noWorks" style="display:none;margin-top:40px">まだ作品がありません。フリースペースで作って保存しよう！</p>
</section>

<!-- クリアモーダル -->
<div class="modal" id="clearModal"><div class="box">
  <div style="font-size:30px;font-weight:900;color:var(--red)">クリア！</div>
  <div id="clearInfo" class="small"></div>
  <img id="clearImg" alt="完成図">
  <div class="btns">
    <button class="red" id="nextBtn" onclick="nextStage()">次のステージ ▶</button>
    <button class="blue" onclick="shareClear()">SNSに投稿</button>
    <button onclick="hideModal('clearModal');showSelect()">ステージ一覧</button>
  </div>
</div></div>

<!-- シェアモーダル -->
<div class="modal" id="shareModal"><div class="box">
  <b>SNSに投稿</b>
  <img id="shareImg" alt="投稿する画像">
  <p class="small" style="margin:4px 0">画像を保存（またはコピー）してから、投稿画面で画像を添付してね。</p>
  <div class="btns">
    <button class="green" onclick="downloadShare()">画像を保存</button>
    <button onclick="copyShare()">画像をコピー</button>
  </div>
  <div class="btns">
    <button style="background:#000;color:#fff" onclick="intent('x')">X</button>
    <button style="background:#000;color:#fff" onclick="intent('threads')">Threads</button>
    <button style="background:#1185fe;color:#fff" onclick="intent('bsky')">Bluesky</button>
    <button style="background:#06c755;color:#fff" onclick="intent('line')">LINE</button>
  </div>
  <div class="btns"><button onclick="hideModal('shareModal')">閉じる</button></div>
</div></div>

<div id="toast"></div>

<script>
// ===================== 共通 =====================
const PAL={R:'#d01012',B:'#0055bf',Y:'#f2cd37',G:'#237841',W:'#f4f4f4',K:'#1b2a34',O:'#fe8a18',L:'#6ec1e4',P:'#f7a1c4',N:'#7c503a',A:'#a0a5a9',M:'#a5ca18',V:'#8a5cc4',T:'#e4cd9e'};
const RANDOM_COLORS=['R','B','Y','G','O','L','P','V','M','N','K','W'];
const $=id=>document.getElementById(id);
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id));window.scrollTo(0,0);if(id==='title')updateProgressText()}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1800)}
function hideModal(id){$(id).classList.remove('show')}
function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){toast('保存できませんでした');return false}}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shade(hex,amt){const c=parseInt(hex.slice(1),16);const f=v=>Math.max(0,Math.min(255,Math.round(amt<0?v*(1+amt):v+(255-v)*amt)));return`rgb(${f(c>>16)},${f(c>>8&255)},${f(c&255)})`}
function sizeCanvas(cv,w,h){const d=window.devicePixelRatio||1;const W=Math.round(w*d),H=Math.round(h*d);if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H}cv.style.width=w+'px';cv.style.height=h+'px';const ctx=cv.getContext('2d');ctx.setTransform(d,0,0,d,0,0);return ctx}
function fmtTime(s){s=Math.floor(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
let audioCtx=null;
function sfx(f=520,d=.06){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=f;o.type='square';g.gain.setValueAtTime(.05,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+d);o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d)}catch(e){}}

// ブロック1マスを描く（edges: 外周かどうか）
function drawCell(ctx,x,y,s,hex,ed,alpha=1){
  ctx.globalAlpha=alpha;
  ctx.fillStyle=hex;ctx.fillRect(x,y,s,s);
  const e=Math.max(1,s*.07);
  if(ed.t){ctx.fillStyle=shade(hex,.35);ctx.fillRect(x,y,s,e)}
  if(ed.l){ctx.fillStyle=shade(hex,.2);ctx.fillRect(x,y,e,s)}
  if(ed.b){ctx.fillStyle=shade(hex,-.35);ctx.fillRect(x,y+s-e,s,e)}
  if(ed.r){ctx.fillStyle=shade(hex,-.25);ctx.fillRect(x+s-e,y,e,s)}
  const cx=x+s/2,cy=y+s/2,r=s*.29;
  ctx.fillStyle=shade(hex,-.32);ctx.beginPath();ctx.arc(cx+s*.04,cy+s*.06,r,0,7);ctx.fill();
  ctx.fillStyle=shade(hex,.1);ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.fill();
  if(s>14){ctx.strokeStyle=shade(hex,.5);ctx.lineWidth=Math.max(1,s*.05);ctx.beginPath();ctx.arc(cx,cy,r*.72,Math.PI*1.05,Math.PI*1.55);ctx.stroke()}
  ctx.globalAlpha=1;
}
// ピースを描く
function drawPiece(ctx,cells,ox,oy,s,hex,alpha=1){
  const set=new Set(cells.map(c=>c[0]+','+c[1]));
  for(const [x,y] of cells){
    drawCell(ctx,ox+x*s,oy+y*s,s,hex,{t:!set.has(x+','+(y-1)),b:!set.has(x+','+(y+1)),l:!set.has((x-1)+','+y),r:!set.has((x+1)+','+y)},alpha);
  }
  // 輪郭
  ctx.globalAlpha=alpha;ctx.strokeStyle='rgba(0,0,0,.45)';ctx.lineWidth=Math.max(1,s*.04);ctx.beginPath();
  for(const [x,y] of cells){const X=ox+x*s,Y=oy+y*s;
    if(!set.has(x+','+(y-1))){ctx.moveTo(X,Y);ctx.lineTo(X+s,Y)}
    if(!set.has(x+','+(y+1))){ctx.moveTo(X,Y+s);ctx.lineTo(X+s,Y+s)}
    if(!set.has((x-1)+','+y)){ctx.moveTo(X,Y);ctx.lineTo(X,Y+s)}
    if(!set.has((x+1)+','+y)){ctx.moveTo(X+s,Y);ctx.lineTo(X+s,Y+s)}}
  ctx.stroke();ctx.globalAlpha=1;
}
// 基礎板
function drawPlate(ctx,ox,oy,w,h,s,hex){
  ctx.fillStyle=hex;ctx.fillRect(ox,oy,w*s,h*s);
  const d=shade(hex,-.18),l=shade(hex,.12);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const cx=ox+x*s+s/2,cy=oy+y*s+s/2,r=s*.26;
    ctx.fillStyle=d;ctx.beginPath();ctx.arc(cx+s*.03,cy+s*.04,r,0,7);ctx.fill();
    ctx.fillStyle=l;ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.fill()}
}
function bbox(cells){let w=0,h=0;for(const [x,y] of cells){if(x+1>w)w=x+1;if(y+1>h)h=y+1}return{w,h}}
function normalize(cells){let mx=1e9,my=1e9;for(const [x,y] of cells){mx=Math.min(mx,x);my=Math.min(my,y)}return cells.map(([x,y])=>[x-mx,y-my])}
function rotCells(cells){const {h}=bbox(cells);return cells.map(([x,y])=>[h-1-y,x])}
function cellKey(cells){return cells.map(c=>c[0]+','+c[1]).sort().join(';')}

// ===================== ステージ生成 =====================
const PICS=[
{n:'ハート',a:['.RR.RR.','RRRRRRR','RRRRRRR','.RRRRR.','..RRR..','...R...']},
{n:'ねこ',a:['K.....K','KK...KK','KKKKKKK','KYKKKYK','KKKPKKK','.KKKKK.','..KKK..']},
{n:'アイス',a:['..PPP..','.PPPPP.','.WWWWW.','.WWRWW.','..TTT..','..TTT..','...T...']},
{n:'きのこ',a:['..RRRR..','.RRWWRR.','RRRWWRRR','RWRRRRWR','RRRRRRRR','..TTTT..','..TTTT..']},
{n:'き',a:['...G...','..GGG..','.GGGGG.','..GGG..','.GGGGG.','GGGGGGG','...N...','..NNN..']},
{n:'ペンギン',a:['..KKK..','.KKKKK.','.KWKWK.','KKWOWKK','KWWWWWK','KWWWWWK','.WWWWW.','..O.O..']},
{n:'はな',a:['..PPP..','.PPYPP.','..PPP..','...G...','GG.G...','.GGG.GG','...GGG.','...G...']},
{n:'さかな',a:['..OOOO...O','.OOOOOO.OO','OKOOOOOOOO','OOOOOOOOOO','.OOOOOO.OO','..OOOO...O']},
{n:'にこにこ',a:['..YYYY..','.YYYYYY.','YYKYYKYY','YYKYYKYY','YYYYYYYY','YKYYYYKY','.YKKKKY.','..YYYY..']},
{n:'いえ',a:['...RR...','..RRRR..','.RRRRRR.','RRRRRRRR','.TTTTTT.','.TLTTLT.','.TTNNTT.','.TTNNTT.']},
{n:'くるま',a:['..BBBBB...','.BLLBLLB..','BBBBBBBBBB','YBBBBBBBBR','BBBBBBBBBB','.KKK..KKK.','..K....K..']},
{n:'あひる',a:['..YYY...','.YYKY...','.YYYYOO.','..YYY...','.YYYYYYY','YYYYYYYY','.YYYYYY.','..OO.OO.']},
{n:'ロケット',a:['...R...','..RWR..','..WWW..','..WLW..','..WWW..','.RWWWR.','RRWWWRR','R.OYO.R','...O...']},
{n:'ほし',a:['....Y....','....Y....','...YYY...','YYYYYYYYY','.YYYYYYY.','..YYYYY..','..YY.YY..','.YY...YY.']},
{n:'ふね',a:['....W....','....WW...','....WWW..','....WWWW.','....N....','NNNNNNNNN','.NNNNNNN.','..NNNNN..','LLLLLLLLL']},
{n:'ロボット',a:['...RR...','.AAAAAA.','.ALAALA.','.AAAAAA.','.AKKKKA.','...AA...','BBBBBBBB','B.BBBB.B','..B..B..','.KK..KK.']},
{n:'すいか',a:['RRRKRRRKR','.RRRRRKR.','.RKRRRRR.','..RRRKR..','...RRR...','...GGG...']},
];
const N_STAGE=100;
function isPicStage(n){return n%6===3}
function stageParams(n){
  const t=(n-1)/(N_STAGE-1);
  return{
    size:4+Math.round(t*10),
    minS:n<6?2:1,maxS:n<30?4:5,
    rotate:n>=8,
    decoys:n<35?0:Math.min(4,1+Math.floor((n-35)/20)),
    mono:!isPicStage(n)&&n>=15&&(n%3===0||n>=80),
    ghostColor:n<=20,
    ncolors:Math.min(6,2+Math.floor(n/18)),
  };
}
function genMask(w,h,rng){
  for(let tr=0;tr<60;tr++){
    const sym=rng()<.7;let g=[];
    for(let y=0;y<h;y++){g.push([]);for(let x=0;x<w;x++)g[y].push(rng()<.62)}
    if(sym)for(let y=0;y<h;y++)for(let x=0;x<w;x++)g[y][w-1-x]=g[y][x];
    for(let it=0;it<2;it++){const g2=g.map(r=>r.slice());
      for(let y=0;y<h;y++)for(let x=0;x<w;x++){let c=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const yy=y+dy,xx=x+dx;if(yy>=0&&xx>=0&&yy<h&&xx<w&&g[yy][xx])c++}g2[y][x]=c>=5}
      g=g2}
    // 最大の連結成分
    const seen=g.map(r=>r.map(()=>false));let best=[];
    for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(g[y][x]&&!seen[y][x]){const comp=[],st=[[x,y]];seen[y][x]=true;
      while(st.length){const [cx,cy]=st.pop();comp.push([cx,cy]);for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=cx+dx,ny=cy+dy;if(nx>=0&&ny>=0&&nx<w&&ny<h&&g[ny][nx]&&!seen[ny][nx]){seen[ny][nx]=true;st.push([nx,ny])}}}
      if(comp.length>best.length)best=comp}
    if(best.length>=w*h*.42&&best.length<=w*h*.9)return normalize(best);
  }
  const r=[];for(let y=0;y<h;y++)for(let x=0;x<w;x++)r.push([x,y]);return r;
}
function partition(grid,w,h,rng,minS,maxS){
  const owner=grid.map(r=>r.map(()=>-1)),pieces=[];
  const D=[[1,0],[-1,0],[0,1],[0,-1]];
  const free=(x,y,c)=>x>=0&&y>=0&&x<w&&y<h&&grid[y][x]===c&&owner[y][x]<0;
  for(;;){
    let best=null,bd=9,cnt=0;
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){if(!grid[y][x]||owner[y][x]>=0)continue;
      const d=D.filter(([dx,dy])=>free(x+dx,y+dy,grid[y][x])).length;
      if(d<bd){bd=d;best=[x,y];cnt=1}else if(d===bd){cnt++;if(rng()<1/cnt)best=[x,y]}}
    if(!best)break;
    const c=grid[best[1]][best[0]],id=pieces.length;
    const size=Math.min(maxS,minS+Math.floor(Math.pow(rng(),.6)*(maxS-minS+1)));
    const cells=[best];owner[best[1]][best[0]]=id;
    while(cells.length<size){const fr=[],seen=new Set();
      for(const [x,y] of cells)for(const [dx,dy] of D){const nx=x+dx,ny=y+dy,k=nx+','+ny;if(!seen.has(k)&&free(nx,ny,c)){seen.add(k);fr.push([nx,ny])}}
      if(!fr.length)break;const p=fr[Math.floor(rng()*fr.length)];owner[p[1]][p[0]]=id;cells.push(p)}
    pieces.push({color:c,cells});
  }
  // 1マスのピースはなるべく隣に合体
  if(minS>1)for(const p of pieces){if(p.cells.length!==1||p.dead)continue;const [x,y]=p.cells[0];
    for(const [dx,dy] of D){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=w||ny>=h)continue;const o=owner[ny][nx];
      if(o>=0&&o!==pieces.indexOf(p)&&pieces[o].color===p.color&&pieces[o].cells.length<maxS&&!pieces[o].dead){pieces[o].cells.push([x,y]);owner[y][x]=o;p.dead=true;break}}}
  return pieces.filter(p=>!p.dead);
}
function genStage(n){
  const P=stageParams(n),rng=mulberry32(n*7919+13);
  let grid,w,h,name,pieces;
  let subset=RANDOM_COLORS.slice().sort(()=>rng()-.5).slice(0,P.ncolors);
  const monoColor=subset[0];
  if(isPicStage(n)){
    const pic=PICS[((n-3)/6)%PICS.length];name=pic.n;
    h=pic.a.length;w=Math.max(...pic.a.map(r=>r.length));
    grid=pic.a.map(r=>{const a=[...r.padEnd(w,'.')].map(c=>c==='.'?null:c);return a});
    pieces=partition(grid,w,h,rng,P.minS,P.maxS);
  }else{
    const sw=P.size,sh=Math.max(3,P.size+Math.floor(rng()*3)-1);
    const cells=genMask(sw,sh,rng);const b=bbox(cells);w=b.w;h=b.h;
    grid=[];for(let y=0;y<h;y++)grid.push(new Array(w).fill(null));
    for(const [x,y] of cells)grid[y][x]='#';
    pieces=partition(grid,w,h,rng,P.minS,P.maxS);
    for(const p of pieces){p.color=P.mono?monoColor:subset[Math.floor(rng()*subset.length)];for(const [x,y] of p.cells)grid[y][x]=p.color}
    name=P.mono?'シルエット':'かたち';
  }
  const out=[];
  pieces.forEach(p=>{
    let mx=1e9,my=1e9;for(const [x,y] of p.cells){mx=Math.min(mx,x);my=Math.min(my,y)}
    const sol=normalize(p.cells);
    let cells=sol;if(P.rotate){const r=Math.floor(rng()*4);for(let i=0;i<r;i++)cells=rotCells(cells)}
    out.push({color:p.color,cells,sol:{key:cellKey(sol),cells:sol,x:mx,y:my},decoy:false});
  });
  for(let i=0;i<P.decoys;i++){
    const size=2+Math.floor(rng()*3);let cells=[[0,0]];const s=new Set(['0,0']);
    while(cells.length<size){const [x,y]=cells[Math.floor(rng()*cells.length)];const [dx,dy]=[[1,0],[-1,0],[0,1],[0,-1]][Math.floor(rng()*4)];const k=(x+dx)+','+(y+dy);if(!s.has(k)){s.add(k);cells.push([x+dx,y+dy])}}
    out.push({color:P.mono?monoColor:subset[Math.floor(rng()*subset.length)],cells:normalize(cells),decoy:true});
  }
  for(let i=out.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[out[i],out[j]]=[out[j],out[i]]}
  out.forEach((p,i)=>{p.id=i;p.placed=null});
  return{n,w,h,target:grid,name,P,pieces:out};
}

function layoutPlay(){

  const cell=Math.max(16,Math.min(52,Math.floor((W-16)/G.w),Math.floor(innerHeight*.48/G.h)));
  L={W,cell,bx:Math.round((W-G.w*cell)/2),by:6};
  const tc=Math.max(11,Math.round(cell*.58));L.tc=tc;
  const gap=Math.round(tc*.6);let x=12,y=L.by+G.h*cell+40,rowH=0;L.trayTop=y-24;
  for(const p of G.pieces){const b=bbox(p.cells);const S=Math.max(b.w,b.h)*tc;

function mix(a,b,t){const A=parseInt(a.slice(1),16),B=parseInt(b.slice(1),16);const f=(sh)=>Math.round(((A>>sh)&255)*(1-t)+((B>>sh)&255)*t);return`rgb(${f(16)},${f(8)},${f(0)})`}

  const sb=$('shapeBtns');sb.innerHTML='';
  FSHAPES.forEach(([name,cells],i)=>{const b=document.createElement('button');b.title=name;if(i===F.shape&&!F.erase)b.classList.add('on');
    const cv=document.createElement('canvas');const bb=bbox(cells);const s=Math.min(10,Math.floor(44/Math.max(bb.w,bb.h)));const ctx=sizeCanvas(cv,bb.w*s,bb.h*s);drawPiece(ctx,cells,0,0,s,PAL[F.color]);
    b.appendChild(cv);b.onclick=()=>{F.shape=i;F.rot=0;F.erase=false;buildFreeUI();drawFree()};sb.appendChild(b)});
  const cb=$('colorBtns');cb.innerHTML='';
  FCOLORS.forEach(k=>{const b=document.createElement('button');b.className='sw'+(k===F.color?' on':'');b.style.background=PAL[k];b.onclick=()=>{F.color=k;F.erase=false;buildFreeUI();drawFree()};cb.appendChild(b)});
  $('eraseBtn').classList.toggle('on',F.erase);
}
function openFree(){$('freeTitle').value=F.title||'';$('freeSize').value=F.w;$('freePlate').value=F.plate;buildFreeUI();show('free');drawFree()}
function newFree(){F={w:16,h:16,pieces:[],plate:'#237841',title:'',id:null,shape:0,rot:0,color:'R',erase:false,undo:[]};autosave();openFree()}
function leaveFree(){autosave();show('title')}
function freeRotate(){F.rot=(F.rot+1)%4;drawFree()}
function toggleErase(){F.erase=!F.erase;buildFreeUI();drawFree()}
function pushUndo(){F.undo.push(JSON.stringify(F.pieces));if(F.undo.length>100)F.undo.shift()}
function freeUndo(){if(!F.undo.length)return;F.pieces=JSON.parse(F.undo.pop());drawFree();autosave()}
function freeClear(){if(!F.pieces.length||!confirm('全部消しますか？'))return;pushUndo();F.pieces=[];drawFree();autosave()}
function freeResize(n){pushUndo();F.w=F.h=n;F.pieces=F.pieces.filter(p=>p.cells.every(([x,y])=>x<n&&y<n));drawFree();autosave()}
function fOcc(){const o=[];for(let y=0;y<F.h;y++)o.push(new Array(F.w).fill(-1));F.pieces.forEach((p,i)=>p.cells.forEach(([x,y])=>{if(o[y])o[y][x]=i}));return o}
function drawFree(){
  const W=Math.min(freeCv.parentElement.clientWidth-32,748);const s=Math.max(8,Math.min(40,Math.floor(W/F.w)));
  FL={s,W:F.w*s,H:F.h*s};const ctx=sizeCanvas(freeCv,FL.W,FL.H);
  drawPlate(ctx,0,0,F.w,F.h,s,F.plate);
  for(const p of F.pieces)drawPiece(ctx,p.cells,0,0,s,PAL[p.color]);
  if(fHover){
    if(F.erase){const o=fOcc();const id=o[fHover[1]]?.[fHover[0]];if(id>=0){ctx.fillStyle='rgba(255,255,255,.5)';for(const [x,y] of F.pieces[id].cells)ctx.fillRect(x*s,y*s,s,s)}}
    else{const c=fPlacement(fHover);const ok=fFits(c);drawPiece(ctx,c,0,0,s,PAL[F.color],ok?.6:.25)}
  }
}
function fPlacement([cx,cy]){const c=curShape();const b=bbox(c);const ox=cx-Math.floor((b.w-1)/2),oy=cy-Math.floor((b.h-1)/2);return c.map(([x,y])=>[x+ox,y+oy])}
function fFits(cells){const o=fOcc();return cells.every(([x,y])=>x>=0&&y>=0&&x<F.w&&y<F.h&&o[y][x]<0)}
function fCell(e){const [px,py]=evPos(e,freeCv);const x=Math.floor(px/FL.s),y=Math.floor(py/FL.s);return x>=0&&y>=0&&x<F.w&&y<F.h?[x,y]:null}
function fAct(cell){
  if(!cell)return;const key=cell+'';if(key===fLastKey)return;fLastKey=key;
  if(F.erase){const o=fOcc();const id=o[cell[1]][cell[0]];if(id>=0){F.pieces.splice(id,1);sfx(300,.05)}}
  else{const c=fPlacement(cell);if(fFits(c)){F.pieces.push({cells:c,color:F.color});sfx(440,.05)}}
  drawFree();
}
freeCv.addEventListener('pointerdown',e=>{if(e.button===2){freeRotate();return}freeCv.setPointerCapture(e.pointerId);pushUndo();fPaint=true;fLastKey='';fHover=fCell(e);fAct(fHover)});
freeCv.addEventListener('pointermove',e=>{fHover=fCell(e);if(fPaint)fAct(fHover);else drawFree()});
freeCv.addEventListener('pointerup',e=>{fPaint=false;if(e.pointerType!=='mouse')fHover=null;drawFree();autosave()});
freeCv.addEventListener('pointerleave',()=>{if(!fPaint){fHover=null;drawFree()}});
freeCv.addEventListener('contextmenu',e=>e.preventDefault());
$('freeTitle').addEventListener('input',autosave);

// ===================== 作品の保存 =====================
function getWorks(){return lsGet('brick_works',[])}
function saveWork(){
  if(!F.pieces.length){toast('ブロックを置いてから保存してね');return}
  const works=getWorks();const title=$('freeTitle').value.trim()||'むだい';F.title=title;
  const data={id:F.id||('w'+Date.now()),title,w:F.w,h:F.h,plate:F.plate,pieces:F.pieces,date:Date.now()};
  const i=works.findIndex(w=>w.id===data.id);if(i>=0)works[i]=data;else works.unshift(data);
  if(lsSet('brick_works',works)){F.id=data.id;autosave();toast('保存しました！')}
}
function freeShareCanvas(w){return makeShareCanvas(w.w,w.h,w.pieces,w.plate,w.title||'むだい','ブリックパズルで作ったよ')}
function shareFree(){if(!F.pieces.length){toast('ブロックを置いてから投稿してね');return}const t=$('freeTitle').value.trim()||'むだい';
  shareImage(freeShareCanvas({w:F.w,h:F.h,pieces:F.pieces,plate:F.plate,title:t}),`ブリックパズルで「${t}」を作ったよ！ #ブリックパズル`)}
function showGallery(){
  const works=getWorks(),box=$('worksList');box.innerHTML='';$('noWorks').style.display=works.length?'none':'block';
  for(const w of works){const d=document.createElement('div');d.className='work';
    const cv=document.createElement('canvas');const s=Math.max(4,Math.floor(150/Math.max(w.w,w.h)));cv.width=w.w*s;cv.height=w.h*s;const ctx=cv.getContext('2d');
    drawPlate(ctx,0,0,w.w,w.h,s,w.plate);for(const p of w.pieces)drawPiece(ctx,p.cells,0,0,s,PAL[p.color]);
    d.appendChild(cv);
    const t=document.createElement('div');t.className='wt';t.textContent=w.title;d.appendChild(t);
    const dt=document.createElement('div');dt.className='small';dt.textContent=new Date(w.date).toLocaleDateString();d.appendChild(dt);
    const bs=document.createElement('div');bs.className='btns';
    const mk=(label,cls,fn)=>{const b=document.createElement('button');b.textContent=label;if(cls)b.className=cls;b.onclick=fn;bs.appendChild(b)};
    mk('開く','blue',()=>{F={...F,w:w.w,h:w.h,pieces:JSON.parse(JSON.stringify(w.pieces)),plate:w.plate,title:w.title,id:w.id,undo:[],erase:false};autosave();openFree()});
    mk('投稿','',()=>shareImage(freeShareCanvas(w),`ブリックパズルで「${w.title}」を作ったよ！ #ブリックパズル`));
    mk('削除','',()=>{if(confirm(`「${w.title}」を削除しますか？`)){lsSet('brick_works',getWorks().filter(x=>x.id!==w.id));if(F.id===w.id)F.id=null;showGallery()}});
    d.appendChild(bs);box.appendChild(d)}
  show('gallery');
}

// ===================== データの書き出し／読み込み =====================
function exportData(){
  const blob=new Blob([JSON.stringify({app:'brick-puzzle',v:1,progress:PROG,works:getWorks(),draft:lsGet('brick_draft',null)})],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='brick-puzzle-save.json';a.click();
}
function importData(input){
  const f=input.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(d.app!=='brick-puzzle')throw 0;
    if(!confirm('今のデータを読み込んだデータで置きかえますか？'))return;
    PROG=d.progress||{cleared:{}};saveProg();lsSet('brick_works',d.works||[]);if(d.draft){lsSet('brick_draft',d.draft);F={...F,...d.draft,undo:[]}}
    updateProgressText();toast('読み込みました')}catch(e){toast('読み込めないファイルです')}input.value=''};
  r.readAsText(f);
}
updateProgressText();
</script>
